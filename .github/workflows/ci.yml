name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: dexter
          POSTGRES_PASSWORD: dexter
          POSTGRES_DB: dexter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dexter -d dexter_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://dexter:dexter@localhost:5432/dexter_test
      TELEGRAM_BOT_TOKEN: test
      TELEGRAM_OWNER_CHAT_ID: "1"
      ANTHROPIC_API_KEY: test
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Instalacija
        run: python -m pip install -e ".[dev]"
      - name: Formatiranje
        run: ruff format --check src tests evals scripts
      - name: Ruff
        run: ruff check src tests evals scripts
      - name: Testovi sa bazom
        run: pytest
      - name: Persona pre i posle izmene sistemskog prompta
        env:
          PERSONA_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD' }}
        run: python -m evals.persona_gate --base "$PERSONA_BASE"

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        extras: ["", "local"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build bez preuzimanja težina modela
        run: docker build --build-arg EXTRAS="${{ matrix.extras }}" -t dexter-provera .
      - name: Provera migracija, skripti i trajnog keša kao neprivilegovan korisnik
        run: |
          docker volume create dexter-provera-data
          docker run --rm dexter-provera python -c 'from dexter.services import invoice_pdf; assert all((invoice_pdf.FONTS / f"Montserrat-{style}.ttf").is_file() for style in ("Regular", "Medium", "SemiBold", "Bold"))'
          docker run --rm -v dexter-provera-data:/app/data dexter-provera python -c 'import os; from pathlib import Path; import scripts.reembed; assert os.getuid() == 10001; assert list(Path("/app/migrations").glob("*.sql")); p = Path(os.environ["HF_HOME"]); p.mkdir(parents=True, exist_ok=True); (p / "provera").write_text("sačuvano")'
          docker run --rm -v dexter-provera-data:/app/data dexter-provera python -c 'import os; from pathlib import Path; assert (Path(os.environ["HF_HOME"]) / "provera").read_text() == "sačuvano"'
          docker volume rm dexter-provera-data
