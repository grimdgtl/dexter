services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: dexter
      POSTGRES_PASSWORD: dexter
      POSTGRES_DB: dexter
    volumes:
      - dexter-pg:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432" # samo lokalno, za psql i debug
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dexter"]
      interval: 5s
      retries: 10

  bot:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://dexter:dexter@db:5432/dexter
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - dexter-data:/app/data # fajlovi, keš lokalnih modela
    restart: unless-stopped

volumes:
  dexter-pg:
  dexter-data:
